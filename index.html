<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cooperativa Taxi Lecce - App Tassista</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<header>

<img src="logo.png" alt="Cooperativa Taxi Lecce">

<div class="driver-name" id="driverName">
Tassista Cristian
</div>

</header>




<main class="container">



<!-- HOME -->

<section id="home" class="page active">


<h1>Home</h1>



<div class="card next-card">


<div class="section-title">
Prossima corsa
</div>


<div class="time">
Nessuna corsa
</div>


<div class="info">
Aggiungi una nuova corsa per visualizzarla qui
</div>


</div>



<div class="card">


<div class="section-title">
Corsa successiva
</div>


Nessuna corsa programmata


</div>


</section>









<!-- LE MIE CORSE -->


<section id="corse" class="page">


<h1>
Le mie corse
</h1>


<div id="prossima"></div>


<h2>
Corse programmate
</h2>


<div id="programmate"></div>



<h2>
Corse completate
</h2>


<div id="completate"></div>


</section>









<!-- AGGIUNGI CORSA -->


<section id="add" class="page">


<h1>
Aggiungi una corsa
</h1>



<div class="card">


<label>
Nome cliente
</label>

<input id="cliente" type="text">



<label>
Numero telefono cliente
</label>

<input id="telefono" type="tel">



<label>
Indirizzo partenza *
</label>

<input id="partenza" type="text">



<label>
Indirizzo arrivo
</label>

<input id="arrivo" type="text">



<label>
Data *
</label>

<input id="data" type="date">



<label>
Orario
</label>

<input id="orario" type="time">



<label>
Numero passeggeri
</label>

<input id="passeggeri" type="number">



<label>
Note extra
</label>

<textarea id="note"></textarea>



<button class="save">

Salva corsa

</button>



</div>









<!-- IMPOSTAZIONI AUTISTA -->


<div class="card">


<h2>
Impostazioni autista
</h2>


<label>
Nome tassista
</label>


<input 
id="driverInput"
type="text"
placeholder="Inserisci nome tassista">



<button 
class="save"
onclick="salvaNomeTassista()">

Salva nome

</button>


</div>



</section>






</main>









<!-- NAVIGAZIONE -->


<nav class="bottom-nav">


<button 
class="nav-item active"
onclick="openPage('home',this)">

Home

</button>



<button 
class="nav-item"
onclick="openPage('corse',this)">

Le mie corse

</button>



<button 
class="nav-item add"
onclick="openPage('add',this)">

+

<br>

Aggiungi una corsa

</button>



</nav>







<script src="app.js"></script>


</body>

</html>
